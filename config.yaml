# ============================================================
# Put Ratio Spread 回测配置
# 路径均相对于 backtest/ 根目录
# ============================================================

# 标的期货产品代码（用于动态构造近月合约 ticker）。
# 支持任意 CME 美债期货代码，例如：
#   "TU" = 2Y, "FV" = 5Y, "TY" = 10Y, "US" = 30Y
# 系统会在每个调仓日自动选择对应产品的近月合约。
product_code: "TY"

# 期权产品代码前缀（通常与 product_code 一致；用于拼期权 ticker）
product_prefix: "TY"

# 是否在进入交割月首日之后自动换月至下一季月合约
roll_on_first_day_of_delivery_month: true

# 回测数据起始/终止日期（YYYY-MM-DD）。
# 可任意指定，系统会自动下载该区间所需的所有近月合约数据。
start_date: "2019-01-01"
end_date: "2024-01-01"

# 期权类型：本策略固定为 Put
option_type: "P"

# 行权价网格参数
strike_step: 0.25
strike_half_width: 3.0

# 网格搜索参数空间
intervals: [0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0]
# ratio = sell_qty / buy_qty；每腿数量必须为整数。
ratio_range:
  min: 0.5
  max: 2.5
  step: 0.1
# A 10-contract buy leg makes every 0.1 sell/buy ratio an integer lot count.
ratio_quantity_scale: 10

# 训练窗口设置
window_type: "rolling"      # "rolling" 或 "expanding"
train_months: 12            # rolling 窗口长度（月）；expanding 时作为最小训练长度

# 回测初始资金
initial_capital: 1000000

# 每腿合约乘数（每点对应的美元金额）。
# 不同期限美债期货乘数不同，例如：TU/FV/TY = 1000，US = 1000。
# 请根据所选 product_code 在 CME 官网确认。
point_value: 1000
# 到期结算字段：优先使用交易所官方最终结算价。
# 若 Bloomberg 中该字段缺失，引擎会 fallback 到 PX_LAST 并打印 warning。
settlement_field: "SETTLE_PRICE"

# 每单买入腿合约数
contracts_per_leg: 1

# 缓存目录（相对 backtest/）
cache_dir: "./cache"

# 报告输出目录（相对 backtest/）
report_dir: "./reports"

backtest:
  entry_schedule: "first_trading_day_of_month"
  hold_to_expiry: true
  roll_existing_positions: false

data:
  # 回测首月之前额外下载的历史月份，用于形成首个训练窗口。
  warmup_months: 12
  # 期权链来源：bloomberg_chain 优先使用 Bloomberg CHAIN_TICKERS；
  # 不可用时 fallback 到 inferred（按 strike 网格构造）。
  option_chain_source: "bloomberg_chain"

execution:
  buy_option_price: "ask"
  sell_option_price: "bid"
  invalid_quote_policy: "skip_trade"
  max_quote_age_days: 0
  # Option quotes are stored in 1/64 price units; reject either leg if its
  # displayed bid/ask width exceeds 12 ticks (12/64 points).
  max_bid_ask_spread_64: 12

strategy:
  require_same_expiry: true
  strike_selection: "nearest_grid_pair_with_valid_quotes"

optimization:
  method: "grid_search"
  objective: "cumulative_pnl"
  minimum_samples: 6
  regime_aware_ratio: false
  tie_break: "interval_then_ratio_ascending"
  near_tie_relative_gap: 0.02

constraints:
  enabled: false

performance:
  # 收益分母：initial_capital | notional | margin
  # - initial_capital: 使用配置初始资金作为名义分母
  # - notional: 使用每笔交易买入腿名义仓位之和作为分母
  # - margin: 使用简化保证金模型（notional * margin_ratio）作为分母
  denominator: "initial_capital"
  margin_ratio: 0.1

report:
  include_training_diagnostics: true
  include_trade_ledger: true
  include_skipped_trades: true

# 尚未完成交易所资料核验；真实回测报告会明确披露该状态。
market_specifications:
  verification_status: "unverified"
  source: null
  verified_at: null
  applies_to: "product_code"
  notes: "核验报价单位、乘数、tick、期权系列映射、到期与最终结算规则后再解读真实绩效。"

# 是否启用择时因子框架（当前为占位实现）
enable_timing_factor: false

# 期权到期日 = 系列月份前一个月的第4个星期五（CME规则）。
# 如遇节假日顺延等特殊情况，可在此手动覆盖，如: {"Z6": "2026-11-27"}
expiry_overrides: {}

# 数据字段
futures_fields: ["PX_LAST"]
option_fields: ["PX_BID", "PX_ASK", "PX_LAST"]
